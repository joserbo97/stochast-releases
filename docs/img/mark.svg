<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Stochast: a skewed distribution whose right tail, past the marker, is the signal orange. -->
  <rect width="64" height="64" rx="14" fill="#1b2140"/>
  <g fill="#f4f1e8">
    <rect x="8" y="40" width="6" height="12" rx="1.2"/>
    <rect x="15" y="24" width="6" height="28" rx="1.2"/>
    <rect x="22" y="16" width="6" height="36" rx="1.2"/>
    <rect x="29" y="22" width="6" height="30" rx="1.2"/>
    <rect x="36" y="31" width="6" height="21" rx="1.2"/>
  </g>
  <rect x="42.6" y="10" width="1.8" height="42" fill="#f4f1e8" fill-opacity="0.7"/>
  <g fill="#ff7a45">
    <rect x="45" y="38" width="6" height="14" rx="1.2"/>
    <rect x="52" y="44" width="5" height="8" rx="1.2"/>
  </g>
</svg>
